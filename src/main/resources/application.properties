# ==============================================
# ScholarPath Application Configuration
# ==============================================
# Set DB_HOST, DB_PORT, DB_NAME, DB_USER, and DB_PASSWORD as environment
# variables. Local connection defaults are localhost:5432/scholarpath.

spring.application.name=scholarpath-backend
server.port=${PORT:8080}
app.cors.allowed-origins=${APP_CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:3000,http://localhost:4173}
server.servlet.session.cookie.same-site=${SESSION_COOKIE_SAME_SITE:lax}
server.servlet.session.cookie.secure=${SESSION_COOKIE_SECURE:false}

# ------ Database Configuration ------
spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:scholarpath}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# ------ JPA / Hibernate ------
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# ------ Logging ------
logging.level.com.scholarpath=INFO
logging.level.org.springframework.web=INFO
