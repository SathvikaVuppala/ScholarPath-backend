# ==============================================
# ScholarPath Application Configuration
# ==============================================
# Set DB_HOST, DB_PORT, DB_NAME, DB_USER, DB_PASSWORD as environment variables
# or edit these values directly for local development.

spring.application.name=scholarpath-backend
server.port=8080

# ------ Database Configuration ------
spring.datasource.url=jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:scholarpath}?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=${DB_USER:root}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ------ JPA / Hibernate ------
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# ------ Logging ------
logging.level.com.scholarpath=DEBUG
logging.level.org.springframework.web=INFO
